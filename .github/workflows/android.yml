name: Build OP4CALCULATE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android --assetPath icon-assets

      - name: Remove old adaptive icon references
        run: rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OP4CALCULATE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
